name: Update book navigation

on:
  push:
    paths:
      - 'ch*.html'
      - 'scripts/build_book.py'
      - 'scripts/book_runtime.js'
      - '.github/workflows/update-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build book.js from chapter HTML
        run: python3 scripts/build_book.py

      - name: Commit generated navigation
        run: |
          if git diff --quiet -- book.js 'ch*.html'; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book.js 'ch*.html'
          git commit -m "chore: update book navigation"
          git push
